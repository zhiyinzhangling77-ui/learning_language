<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国語コーチ — 30日プログラム</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0a0a0c;--bg1:#13131a;--bg2:#1c1c26;--bg3:#262633;--bg4:#333344;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text0:#f1f1f7;--text1:#a8a8b8;--text2:#5f5f70;
  --red:#e25c5c;--red2:#f0837a;--red-bg:rgba(226,92,92,.13);
  --gold:#e0b34a;--gold2:#f5cf76;--gold-bg:rgba(224,179,74,.12);
  --teal:#34c5a8;--teal2:#5fe3c6;--teal-bg:rgba(52,197,168,.13);
  --indigo:#7c8cf5;--indigo-bg:rgba(124,140,245,.12);
  --r:10px;--r2:14px;
}
body{background:var(--bg0);color:var(--text0);font-family:'Inter','Noto Sans SC',sans-serif;font-size:14px;height:100vh;overflow:hidden}
button{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:99px}
.hz{font-family:'Noto Sans SC'}
.app{display:grid;grid-template-rows:54px 56px 1fr;height:100vh}

.topbar{background:var(--bg1);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:16px}
.logo{font-family:'Syne';font-weight:800;font-size:16px;color:var(--red2);letter-spacing:-.02em;white-space:nowrap}
.logo em{color:var(--text1);font-style:normal;font-weight:400;font-size:11px;margin-left:8px}
.tools{flex:1;display:flex;justify-content:center;gap:6px;align-items:center}
.tselect{background:var(--bg2);border:1px solid var(--line2);color:var(--text0);font-family:inherit;font-size:13px;padding:7px 11px;border-radius:7px;outline:none;min-width:200px}
.tselect:focus{border-color:var(--red2)}
.langlinks{display:flex;gap:10px}
.langlink{font-size:11px;color:var(--text2);text-decoration:none;white-space:nowrap}
.langlink:hover{color:var(--text1)}
.gear{background:var(--bg2);border:1px solid var(--line2);color:var(--text1);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px}
.gear:hover{border-color:var(--red2);color:var(--red2)}
.gear.warn{border-color:var(--gold);color:var(--gold)}

.steps{background:var(--bg1);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:6px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;cursor:pointer;font-size:12.5px;color:var(--text2);border:1px solid transparent;white-space:nowrap;transition:all .15s}
.step:hover{color:var(--text1)}
.step.active{background:var(--red-bg);color:var(--red2);border-color:rgba(226,92,92,.3)}
.step .n{background:var(--bg3);border:1px solid var(--line2);color:var(--text1);width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Syne'}
.step.active .n{background:var(--red);color:#fff;border-color:var(--red)}
.step.done .n{background:var(--teal-bg);color:var(--teal2);border-color:rgba(52,197,168,.4)}

.stage{overflow-y:auto;padding:24px}
.wrap{max-width:760px;margin:0 auto}

.card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r2);padding:20px;margin-bottom:16px}
.card h3{font-family:'Syne';font-size:15px;color:var(--red2);margin-bottom:5px}
.card .sub{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.6}
.card .sub code{background:var(--bg3);border-radius:4px;padding:1px 6px;color:var(--gold2);font-family:'Noto Sans SC';font-size:12px}

.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red2)}
.btn-gold{background:var(--gold);color:#1a1100}.btn-gold:hover{background:var(--gold2)}
.btn-teal{background:var(--teal);color:#04211b}.btn-teal:hover{background:var(--teal2)}
.btn-indigo{background:var(--indigo-bg);color:var(--indigo);border:1px solid rgba(124,140,245,.3)}.btn-indigo:hover{background:rgba(124,140,245,.22)}
.btn-ghost{background:var(--bg3);color:var(--text1);border:1px solid var(--line2)}.btn-ghost:hover{border-color:var(--red2);color:var(--red2)}
.btn-rec{background:var(--bg3);color:var(--text1);border:1px solid var(--line2)}
.btn-rec.recording{background:var(--red-bg);color:var(--red2);border-color:var(--red2);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,92,92,.4)}50%{box-shadow:0 0 0 8px rgba(226,92,92,0)}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:6px 11px;font-size:12px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* chat */
.chat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:480px;overflow-y:auto;margin-bottom:12px}
.msg{margin-bottom:12px;display:flex;gap:10px}
.msg .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;font-family:'Syne'}
.msg.ai .av{background:var(--red-bg);color:var(--red2);border:1px solid rgba(226,92,92,.3)}
.msg.user .av{background:var(--bg3);color:var(--text1);border:1px solid var(--line2)}
.msg .bub{flex:1;font-size:14px;line-height:1.7;padding-top:4px}
.msg.user{flex-direction:row-reverse}.msg.user .bub{text-align:right}
.msg .bub.zh{font-family:'Noto Sans SC';font-size:15px}
.input-row{display:flex;gap:8px}
.input-row textarea{flex:1;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;color:var(--text0);font-family:'Inter','Noto Sans SC';font-size:14px;padding:10px 12px;resize:none;height:42px;outline:none;line-height:1.5}
.input-row textarea:focus{border-color:var(--red2)}

/* summary */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.sum-grid{grid-template-columns:1fr}}
.sum-box{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:13px}
.sum-box h5{font-size:11px;color:var(--gold);margin-bottom:8px;letter-spacing:.04em}
.sum-box ul{list-style:none;font-size:13px;line-height:1.8}
.sum-box li::before{content:'•';color:var(--text2);margin-right:6px}

/* vocab table */
.vt{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg2);border-radius:9px;overflow:hidden}
.vt th{background:var(--bg3);padding:9px 10px;text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;color:var(--text1);border-bottom:1px solid var(--line)}
.vt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.vt .zh{font-family:'Noto Sans SC';font-weight:600;color:var(--gold)}
.vt .py{font-size:11px;color:var(--text2);font-family:'Noto Sans SC'}
.vt .ex{font-family:'Noto Sans SC';color:var(--text1);font-size:12px}
.vt .hsk{display:inline-block;background:var(--indigo-bg);color:var(--indigo);border-radius:99px;font-size:10px;font-weight:700;padding:1px 7px}

/* day tabs */
.day-tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.day-tab{padding:7px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--text1);font-size:12px;cursor:pointer}
.day-tab.active{background:var(--red-bg);color:var(--red2);border-color:rgba(226,92,92,.3)}
.day-tab .dn{font-family:'Syne';font-weight:700;margin-right:5px}

.passage{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--red2);border-radius:5px 11px 11px 5px;padding:16px 18px;line-height:2;font-family:'Noto Sans SC';font-size:16px;letter-spacing:.02em}
.pinyin-line{display:block;font-family:'Noto Sans SC';font-size:11px;color:var(--gold);line-height:1.4;margin-bottom:6px}
.hanzi-line{display:block;font-family:'Noto Sans SC';font-size:16px;line-height:1.5;margin-bottom:14px}

.metric-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.metric{flex:1;min-width:120px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.metric .n{font-family:'Syne';font-size:22px;font-weight:700}
.metric .l{font-size:10px;color:var(--text2);margin-top:2px;letter-spacing:.05em;text-transform:uppercase}

.sc-list{margin-top:10px}
.sc-item{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin-bottom:7px}
.sc-item .pt{font-family:'Noto Sans SC';color:var(--gold);font-weight:600;font-size:14px;margin-bottom:3px}
.sc-item .wh{font-size:12px;color:var(--text1);line-height:1.6}

/* timer */
.timer-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:22px;text-align:center}
.timer-display{font-family:'Syne';font-size:54px;font-weight:800;color:var(--gold);line-height:1;margin-bottom:8px}
.timer-display.warn{color:var(--red2)}
.timer-label{font-size:12px;color:var(--text2);margin-bottom:18px;letter-spacing:.06em}

/* feedback */
.fb-section{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:13px 16px;margin-bottom:10px}
.fb-section h5{font-size:11px;color:var(--gold);margin-bottom:8px;letter-spacing:.05em}
.fb-list{font-size:13px;line-height:1.8}
.fb-list li{margin-bottom:5px;list-style:none}
.fb-row{padding:6px 0;border-bottom:1px solid var(--line)}
.fb-row:last-child{border:none}
.fb-row .orig{color:var(--red2);text-decoration:line-through;margin-right:8px;font-family:'Noto Sans SC'}
.fb-row .fix{color:var(--teal);font-family:'Noto Sans SC';font-weight:500}
.fb-row .why{font-size:11px;color:var(--text2);margin-top:3px}

/* scene cards */
.scene-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:600px){.scene-grid{grid-template-columns:1fr}}
.scene{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:13px;position:relative}
.scene .num{position:absolute;top:10px;right:12px;font-family:'Syne';font-size:18px;font-weight:800;color:var(--text2)}
.scene .t{font-size:11px;color:var(--gold);letter-spacing:.05em;margin-bottom:6px}
.scene .d{font-size:13px;color:var(--text0);line-height:1.6;margin-bottom:8px}
.scene .kw{display:flex;flex-wrap:wrap;gap:4px}
.scene .kw .k{font-family:'Noto Sans SC';font-size:11px;background:var(--red-bg);color:var(--red2);border-radius:99px;padding:1px 7px}

/* round indicator */
.round-bar{display:flex;gap:8px;margin-bottom:14px}
.round{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center;font-size:11px;color:var(--text2)}
.round.active{border-color:var(--red2);color:var(--red2);background:var(--red-bg)}
.round.done{border-color:var(--teal);color:var(--teal2);background:var(--teal-bg)}
.round .rn{font-family:'Syne';font-size:18px;font-weight:700;margin-bottom:2px}

/* loading */
.loading{display:inline-flex;align-items:center;gap:8px;color:var(--text1);font-size:13px}
.loading::before{content:'';width:14px;height:14px;border:2px solid var(--bg3);border-top-color:var(--red2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* empty */
.empty{text-align:center;padding:50px 20px;color:var(--text2)}
.empty .big{font-size:48px;margin-bottom:14px}
.empty h3{font-family:'Syne';font-size:18px;color:var(--text0);margin-bottom:8px}
.empty p{font-size:13px;line-height:1.8;margin-bottom:10px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,12,.88);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:26px;max-width:480px;width:100%}
.modal h3{font-family:'Syne';font-size:18px;color:var(--red2);margin-bottom:8px}
.modal p{font-size:12.5px;color:var(--text1);line-height:1.7;margin-bottom:14px}
.modal input,.modal select{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:8px;color:var(--text0);font-family:inherit;font-size:13px;padding:10px 13px;outline:none;margin-bottom:12px}
.modal input:focus,.modal select:focus{border-color:var(--red2)}
.modal-row{display:flex;gap:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line2);border-radius:8px;padding:10px 20px;font-size:13px;color:var(--gold);z-index:600;box-shadow:0 8px 30px rgba(0,0,0,.5)}

.live{font-size:14px;color:var(--text0);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:10px 13px;min-height:60px;font-family:'Noto Sans SC';line-height:1.6}
.live:empty::before{content:'録音すると、ここに認識結果が出ます';color:var(--text2);font-style:italic;font-family:'Inter'}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">中文 Coach <em>30日プログラム</em></div>
    <div class="tools">
      <select class="tselect" id="topic-sel" onchange="selectTopic(this.value)"></select>
      <button class="btn btn-ghost btn-sm" onclick="openNewTopic()">＋ 新しい週/トピック</button>
    </div>
    <div class="langlinks">
      <a class="langlink" href="flashcards.html">📇 単語帳</a>
      <a class="langlink" href="chinese.html">🎤 会話</a>
      <a class="langlink" href="index.html">EN</a>
    </div>
    <button class="gear" id="gear-btn" onclick="openKeyModal()" title="APIキー">⚙</button>
  </div>
  <div class="steps" id="steps"></div>
  <div class="stage" id="stage"></div>
</div>

<div class="modal-bg" id="key-modal">
  <div class="modal">
    <h3>Anthropic APIキー</h3>
    <p>このコーチは Claude API を使って雑談・添削・生成を行います。<br>キーはこの端末のブラウザにのみ保存され、外部送信は Anthropic API への直接通信のみです。<br>※ 中国語版アプリで保存したキー（zh_key）も自動的に使われます。</p>
    <input type="password" id="key-input" placeholder="sk-ant-..." />
    <div class="modal-row">
      <button class="btn btn-red" style="flex:1" onclick="saveKey()">保存</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeKeyModal()">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="new-modal">
  <div class="modal">
    <h3>新しいトピック（1週間）</h3>
    <p>「1週間 = 1トピック」のルールで深掘りします。例：猫 / 大学生活 / 旅行 / プログラミング …</p>
    <input id="nt-name" placeholder="今週のトピックを日本語で（例：猫）" />
    <input id="nt-week" type="number" min="1" max="52" placeholder="週番号（例：1）" />
    <div class="modal-row">
      <button class="btn btn-red" style="flex:1" onclick="createTopic()">作成</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeNewTopic()">キャンセル</button>
    </div>
  </div>
</div>

<script>
// ════════ STATE ════════
let apiKey = localStorage.getItem('zh_key') || localStorage.getItem('coach_key') || '';
let topics = JSON.parse(localStorage.getItem('coach_topics') || '[]');
let curId = localStorage.getItem('coach_cur') || null;
let curStep = 1;

// recording state
let rec=null, recording=false, sttBuf='', recCb=null;
let timerHandle=null;

const STEP_NAMES = ['','日本語で会話ネタ抽出','必要単語表を生成','Narrow Reading 7本','音読＋発音変化','1分中国語スピーチ','321リテリング','ロールプレイ＋FB'];

function blankTopic(name, week){
  return { id:'t'+Date.now(), name, week:week||1, createdAt:Date.now(),
    s1:{ messages:[], summary:null },
    s2:{ vocab:null },
    s3:{ days:null, picked:0 },
    s4:{ perDay:{} },
    s5:{ transcript:'', result:null, prompt:'' },
    s6:{ scenes:null, rounds:[null,null,null] },
    s7:{ setting:'', messages:[], feedback:null }
  };
}
if(!topics.length){ const t=blankTopic('猫',1); topics.push(t); curId=t.id; persist(); }
if(!curId || !topics.find(t=>t.id===curId)) curId=topics[0].id;

function persist(){ localStorage.setItem('coach_topics',JSON.stringify(topics)); if(curId) localStorage.setItem('coach_cur',curId); }
function cur(){ return topics.find(t=>t.id===curId); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function aq(s){ return JSON.stringify(s==null?'':String(s)).replace(/"/g,'&quot;'); }
function toast(m){ const e=document.createElement('div'); e.className='toast'; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),2400); }

// ════════ CLAUDE ════════
async function callClaude({system, messages, max_tokens=1400, model='claude-sonnet-4-6'}){
  if(!apiKey) throw new Error('APIキーが未設定です（右上の⚙）');
  const body = { model, max_tokens, messages };
  if(system) body.system = system;
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify(body)
  });
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error?.message || ('HTTP '+r.status)); }
  const d = await r.json();
  return d.content.map(c=>c.text||'').join('');
}
function parseJson(raw){
  let s = raw.replace(/```json|```/g,'').trim();
  const i = s.search(/[\[{]/); if(i>=0) s = s.slice(i);
  // trim trailing prose after last } or ]
  let depth=0, last=-1, inStr=false, esc=false;
  for(let k=0;k<s.length;k++){ const c=s[k];
    if(inStr){ if(esc){esc=false;continue;} if(c==='\\'){esc=true;continue;} if(c==='"'){inStr=false;continue;} continue; }
    if(c==='"'){inStr=true;continue;}
    if(c==='{'||c==='[') depth++;
    else if(c==='}'||c===']'){ depth--; if(depth===0) last=k; }
  }
  if(last>=0) s = s.slice(0,last+1);
  return JSON.parse(s);
}

// ════════ SPEECH ════════
function speak(text, rate){
  if(!('speechSynthesis' in window)){ toast('読み上げ非対応のブラウザです'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=rate||1.0;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(x=>/zh[-_]CN/i.test(x.lang))||vs.find(x=>/^zh/i.test(x.lang));
  if(v) u.voice=v; speechSynthesis.speak(u);
}
function startRec(onLive){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('音声認識はChrome/Edge推奨'); return false; }
  rec = new SR(); rec.lang='zh-CN'; rec.continuous=true; rec.interimResults=true;
  sttBuf=''; recording=true;
  rec.onresult = (e)=>{ let fin=sttBuf, interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) fin+=t; else interim+=t; }
    sttBuf=fin; if(onLive) onLive(sttBuf+interim);
  };
  rec.onerror = (e)=>{ if(e.error!=='no-speech'&&e.error!=='aborted') toast('音声エラー: '+e.error); };
  rec.onend = ()=>{ if(recording){ try{ rec.start(); }catch(_){} } };
  try{ rec.start(); }catch(_){}
  return true;
}
function stopRec(){ recording=false; if(rec){ try{ rec.stop(); }catch(_){} } if(recCb){ recCb(sttBuf.trim()); recCb=null; } }

// ════════ HEADER UI ════════
function renderTopicSel(){
  const sel = document.getElementById('topic-sel');
  sel.innerHTML = topics.map(t=>`<option value="${t.id}" ${t.id===curId?'selected':''}>Week ${t.week} ・ ${esc(t.name)}</option>`).join('');
}
function renderSteps(){
  const t=cur(); const el=document.getElementById('steps');
  el.innerHTML = STEP_NAMES.slice(1).map((nm,i)=>{
    const n=i+1; const done = isStepDone(t,n);
    return `<div class="step ${curStep===n?'active':''} ${done?'done':''}" onclick="goStep(${n})"><span class="n">${done?'✓':n}</span>${esc(nm)}</div>`;
  }).join('');
  document.getElementById('gear-btn').classList.toggle('warn', !apiKey);
}
function isStepDone(t,n){
  if(!t) return false;
  if(n===1) return !!t.s1.summary;
  if(n===2) return !!(t.s2.vocab && t.s2.vocab.length);
  if(n===3) return !!(t.s3.days && t.s3.days.length);
  if(n===4) return Object.keys(t.s4.perDay||{}).length>0;
  if(n===5) return !!t.s5.result;
  if(n===6) return !!(t.s6.scenes && t.s6.rounds.some(r=>r));
  if(n===7) return !!t.s7.feedback;
  return false;
}
function goStep(n){ curStep=n; renderSteps(); renderStage(); }
function selectTopic(id){ curId=id; curStep=1; persist(); renderSteps(); renderStage(); }

}
function s7Mic(){
  const btn=document.getElementById('s7-mic');
  if(recording){ recCb=(final)=>{ document.getElementById('s7-input').value=final; btn.classList.remove('recording'); }; stopRec(); return; }
  const ok = startRec(live=>{ document.getElementById('s7-input').value=live; });
  if(ok){ btn.classList.add('recording'); }
}
async function s7Feedback(){
  const t=cur();
  toast('フィードバックを生成中…');
  try{
    const raw = await callClaude({
      system:'出力はJSONのみ。',
      messages:[{role:'user', content:
`次の中国語ロールプレイ会話を踏まえて、ユーザーへのフィードバックを日本語で書いてください（評価対象はユーザー＝你の発話のみ）。
場面：${t.s7.setting}
会話：
${t.s7.messages.map(m=>(m.role==='user'?'你':'伙伴')+'：'+m.text).join('\n')}

JSONのみ：{
  "good": ["良かった点（日本語）1〜3個"],
  "improve": [ {"orig":"ユーザーの間違った中国語", "fix":"修正", "why":"日本語の説明"} ],
  "rewrite": [ {"orig":"ユーザーの中国語", "natural":"より自然な言い換え（中国語）"} ],
  "nextVocab": [ {"zh":"中国語", "py":"拼音", "ja":"日本語"} ]
}`
      }], max_tokens: 1800
    });
    const fb = parseJson(raw);
    t.s7.feedback = fb; persist(); renderS7(t);
    toast('フィードバック完成 ✓');
  }catch(e){ toast('フィードバックエラー: '+e.message); }
}
function renderS7Feedback(f){
  return `<div class="card">
    <h3>🏁 ロールプレイ フィードバック</h3>
    <div class="fb-section"><h5>✓ 良かった点</h5><ul class="fb-list">${(f.good||[]).map(x=>`<li>・ ${esc(x)}</li>`).join('')}</ul></div>
    <div class="fb-section"><h5>📝 改善表現</h5>${(f.improve||[]).map(x=>`<div class="fb-row"><span class="orig">${esc(x.orig||'')}</span> → <span class="fix">${esc(x.fix||'')}</span><div class="why">${esc(x.why||'')}</div></div>`).join('')||'<div style="font-size:12px;color:var(--text2)">特になし</div>'}</div>
    <div class="fb-section"><h5>⭐ 自然な言い換え</h5>${(f.rewrite||[]).map(x=>`<div class="fb-row"><span style="color:var(--text2);font-family:'Noto Sans SC'">${esc(x.orig||'')}</span><div style="margin-top:3px"><span class="fix">→ ${esc(x.natural||'')}</span> <button class="btn btn-ghost btn-sm" style="padding:2px 7px" onclick="speak(${aq(x.natural||'')})">🔊</button></div></div>`).join('')||'<div style="font-size:12px;color:var(--text2)">特になし</div>'}</div>
    <div class="fb-section"><h5>📇 次に覚える語彙</h5>
      <div style="overflow-x:auto"><table class="vt"><thead><tr><th>中国語</th><th>拼音</th><th>日本語</th></tr></thead><tbody>${(f.nextVocab||[]).map(v=>`<tr><td class="zh">${esc(v.zh||'')}</td><td class="py">${esc(v.py||'')}</td><td>${esc(v.ja||'')}</td></tr>`).join('')}</tbody></table></div>
      ${f.nextVocab?.length?`<button class="btn btn-teal btn-sm" style="margin-top:10px" onclick="s7ToFlashcards()">📇 フラッシュカードに追加</button>`:''}
    </div>
    <div class="row"><button class="btn btn-ghost" onclick="goStep(1)">🔄 次の週のトピックへ（STEP 1）</button></div>
  </div>`;
}
function s7ToFlashcards(){
  const t=cur(); const v=t.s7.feedback.nextVocab||[]; if(!v.length) return;
  let decks = JSON.parse(localStorage.getItem('fc_decks')||'null') || [];
  // try to find an existing deck for this topic
  const wanted = `Week${t.week} ${t.name} / コーチ`;
  let deck = decks.find(d=>d.name===wanted);
  if(!deck){ deck = { id:'d'+Date.now(), name:wanted, lang:'zh-CN', cards:[] }; decks.push(deck); }
  v.forEach(w=>{ deck.cards.push({ id:'c'+Date.now()+Math.random().toString(36).slice(2,6), front:w.zh, mean:((w.py?w.py+' / ':'')+(w.ja||'')).trim(), ex:'', box:0,due:0,reps:0 }); });
  localStorage.setItem('fc_decks', JSON.stringify(decks));
  toast(`${v.length} 語を「${deck.name}」に追加しました ✓`);
}

// ════════ MODALS / TOPIC MGMT ════════
function openKeyModal(){ document.getElementById('key-input').value=apiKey; document.getElementById('key-modal').classList.add('show'); }
function closeKeyModal(){ document.getElementById('key-modal').classList.remove('show'); }
function saveKey(){ apiKey=document.getElementById('key-input').value.trim(); localStorage.setItem('coach_key',apiKey); localStorage.setItem('zh_key',apiKey); closeKeyModal(); renderSteps(); renderStage(); toast(apiKey?'キーを保存しました':'キーを削除しました'); }
function openNewTopic(){ document.getElementById('nt-name').value=''; document.getElementById('nt-week').value=topics.length+1; document.getElementById('new-modal').classList.add('show'); setTimeout(()=>document.getElementById('nt-name').focus(),50); }
function closeNewTopic(){ document.getElementById('new-modal').classList.remove('show'); }
function createTopic(){
  const name=document.getElementById('nt-name').value.trim();
  const week=parseInt(document.getElementById('nt-week').value)||(topics.length+1);
  if(!name){ toast('トピック名を入力してください'); return; }
  const t=blankTopic(name,week); topics.push(t); curId=t.id; curStep=1; persist();
  closeNewTopic(); renderTopicSel(); renderSteps(); renderStage();
  toast(`Week ${week} ${name} を作成しました ✓`);
}

// init
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; }
renderTopicSel(); renderSteps(); renderStage();
</script>
